openapi: 3.0.3
info:
  title: GeoRecorregut Locations Tool API
  description: API to search and retrieve travel locations and visited places for the Gemini Enterprise agent. Allows searching and filtering visited places by continent, country, name, and favorite status.
  version: 1.0.0
servers:
  - url: https://europe-west4-georecorregut.cloudfunctions.net
    description: Google Cloud Functions server (europe-west4 region)
paths:
  /searchLocations:
    get:
      operationId: searchLocations
      summary: Search and filter visited travel locations
      description: Retrieves the list of visited cities and locations stored in the GeoRecorregut database. Supports optional filters by continent, country, location name, and favorite status. Text comparisons are case-insensitive and accent-insensitive. When no filters are provided, all registered locations are returned. All provided filters are combined using logical AND.
      parameters:
        - name: continent
          in: query
          required: false
          description: Filter by the name of the continent where the location is situated (e.g. 'Asia', 'Europe', 'North America', 'South America', 'Africa', 'Oceania'). Case-insensitive and accent-insensitive.
          schema:
            type: string
            example: Asia
        - name: country
          in: query
          required: false
          description: Filter by the name of the visited country (e.g. 'Japan', 'Spain', 'France', 'Italy'). Case-insensitive and accent-insensitive.
          schema:
            type: string
            example: Japan
        - name: name
          in: query
          required: false
          description: Filter by partial match (substring) in the name of the visited city or place (e.g. 'Tokyo', 'Kyoto', 'Barc'). Useful when the user mentions a city or partial name. Case-insensitive and accent-insensitive.
          schema:
            type: string
            example: Tokyo
        - name: isFavorite
          in: query
          required: false
          description: Filter by whether the place was marked as favorite by the user. Pass true to return only favorite places, or false for non-favorites.
          schema:
            type: boolean
            example: true
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: List of matching visited locations and total count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchLocationsResponse'
              examples:
                japanFavorites:
                  summary: Favorite places in Japan
                  value:
                    count: 2
                    results:
                      - name: Tokyo
                        country: Japan
                        continent: Asia
                        isFavorite: true
                        lat: 35.6762
                        lng: 139.6503
                      - name: Kyoto
                        country: Japan
                        continent: Asia
                        isFavorite: true
                        lat: 35.0116
                        lng: 135.7681
        '400':
          description: Invalid query parameters (e.g., invalid value for isFavorite).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized. Missing or invalid X-API-Key header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Method Not Allowed. Only HTTP GET method is supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error querying Firestore or security configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key authentication secret required to authorize requests from Gemini Enterprise.
  schemas:
    Location:
      type: object
      required:
        - name
        - country
        - continent
        - isFavorite
        - lat
        - lng
      properties:
        name:
          type: string
          description: Name of the visited city or place.
          example: Tokyo
        country:
          type: string
          description: Country where the place is located.
          example: Japan
        continent:
          type: string
          description: Continent where the place is located.
          example: Asia
        isFavorite:
          type: boolean
          description: Indicates whether the location is marked as favorite.
          example: true
        lat:
          type: number
          format: float
          description: Geographic latitude of the location.
          example: 35.6762
        lng:
          type: number
          format: float
          description: Geographic longitude of the location.
          example: 139.6503
    SearchLocationsResponse:
      type: object
      required:
        - count
        - results
      properties:
        count:
          type: integer
          description: Total count of locations returned matching the search criteria.
          example: 2
        results:
          type: array
          description: Array of matched visited locations.
          items:
            $ref: '#/components/schemas/Location'
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Descriptive error message explaining the issue.
          example: "Unauthorized: Invalid or missing API key in 'X-API-Key' header."
